<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#030305',
                            darker: '#08080c',
                            card: '#0d0e15',
                            border: '#1a1d2d',
                            green: '#00ff66',
                            cyan: '#00f0ff',
                            amber: '#ffb000',
                            red: '#ff0055',
                        }
                    },
                    fontFamily: {
                        mono: ['"Fira Code"', '"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styling & CRT Effects */
        body {
            background-color: #030305;
            color: #00ff66;
            font-family: 'Fira Code', monospace;
            overflow-x: hidden;
            --accent-color: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --accent-border: rgba(0, 255, 102, 0.3);
        }

        /* Color Theme Classes */
        body.theme-cyan {
            color: #00f0ff;
            --accent-color: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --accent-border: rgba(0, 240, 255, 0.3);
        }
        body.theme-amber {
            color: #ffb000;
            --accent-color: #ffb000;
            --accent-glow: rgba(255, 176, 0, 0.4);
            --accent-border: rgba(255, 176, 0, 0.3);
        }
        body.theme-red {
            color: #ff0055;
            --accent-color: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.4);
            --accent-border: rgba(255, 0, 85, 0.3);
        }

        .accent-text { color: var(--accent-color); }
        .accent-bg { background-color: var(--accent-color); }
        .accent-border { border-color: var(--accent-border); }
        .accent-glow { box-shadow: 0 0 15px var(--accent-glow); }
        .accent-glow-text { text-shadow: 0 0 8px var(--accent-glow); }

        /* CRT Scanline Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 40;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 40;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.27861; }
            5% { opacity: 0.34769; }
            10% { opacity: 0.23604; }
            15% { opacity: 0.90626; }
            20% { opacity: 0.18128; }
            25% { opacity: 0.83891; }
            30% { opacity: 0.65583; }
            35% { opacity: 0.67807; }
            40% { opacity: 0.26559; }
            45% { opacity: 0.84693; }
            50% { opacity: 0.96019; }
            55% { opacity: 0.08523; }
            60% { opacity: 0.20313; }
            65% { opacity: 0.71988; }
            70% { opacity: 0.53455; }
            75% { opacity: 0.37288; }
            80% { opacity: 0.71428; }
            85% { opacity: 0.70419; }
            90% { opacity: 0.7003; }
            95% { opacity: 0.36108; }
            100% { opacity: 0.24387; }
        }

        /* Glitch Animation */
        .glitch {
            position: relative;
            display: inline-block;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch:hover::before {
            left: 2px;
            text-shadow: -2px 0 #ff0055;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 1s infinite linear alternate-reverse;
        }

        .glitch:hover::after {
            left: -2px;
            text-shadow: -2px 0 #00f0ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 1s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(50px, 9999px, 85px, 0); }
            40% { clip: rect(10px, 9999px, 35px, 0); }
            60% { clip: rect(70px, 9999px, 10px, 0); }
            80% { clip: rect(25px, 9999px, 95px, 0); }
            100% { clip: rect(60px, 9999px, 40px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(70px, 9999px, 30px, 0); }
            20% { clip: rect(15px, 9999px, 65px, 0); }
            40% { clip: rect(85px, 9999px, 10px, 0); }
            60% { clip: rect(30px, 9999px, 90px, 0); }
            80% { clip: rect(65px, 9999px, 20px, 0); }
            100% { clip: rect(10px, 9999px, 80px, 0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030305;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-border);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Blinking Cursor */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cyber-card {
            background: rgba(13, 14, 21, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--accent-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="crt min-h-screen flex flex-col justify-between selection:bg-gray-800 selection:text-green-400">

    <!-- Matrix Canvas Background -->
    <canvas id="matrixCanvas" class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none"></canvas>

    <!-- Top Navigation / Status Header -->
    <header class="w-full border-b border-gray-800/80 bg-cyber-black/90 backdrop-blur-md px-4 py-3 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="inline-block w-3 h-3 rounded-full accent-bg animate-pulse"></span>
                <span class="text-xs tracking-widest uppercase font-bold text-gray-300">
                    NODE_ID: <span class="accent-text">_BLANK</span>
                </span>
                <span class="text-xs text-gray-600 hidden sm:inline">|</span>
                <span class="text-xs text-gray-400 hidden sm:inline">STATUS: <span class="text-red-400 font-semibold">UNKNOWN</span></span>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center gap-3 text-xs">
                <!-- Sound Toggle Button -->
                <button id="soundToggle" onclick="toggleAudio()" class="px-2.5 py-1 rounded border border-gray-800 hover:border-gray-600 bg-cyber-card transition flex items-center gap-2 text-gray-300">
                    <i id="soundIcon" class="fas fa-volume-mute text-red-400"></i>
                    <span id="soundText" class="hidden md:inline">AUDIO: OFF</span>
                </button>

                <!-- Matrix Rain Toggle -->
                <button id="matrixToggle" onclick="toggleMatrix()" class="px-2.5 py-1 rounded border border-gray-800 hover:border-gray-600 bg-cyber-card transition flex items-center gap-2 text-gray-300">
                    <i class="fas fa-terminal accent-text"></i>
                    <span id="matrixText" class="hidden md:inline">RAIN: ON</span>
                </button>

                <!-- CRT Overlay Toggle -->
                <button onclick="toggleCRT()" class="px-2.5 py-1 rounded border border-gray-800 hover:border-gray-600 bg-cyber-card transition flex items-center gap-2 text-gray-300">
                    <i class="fas fa-tv accent-text"></i>
                    <span class="hidden md:inline">CRT SCAN</span>
                </button>

                <!-- Customization Trigger -->
                <button onclick="toggleModal('customPanel')" class="px-2.5 py-1 rounded accent-border bg-cyber-card hover:bg-cyber-border transition accent-text flex items-center gap-2">
                    <i class="fas fa-cog"></i>
                    <span class="hidden md:inline">THEME</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full px-4 py-8 flex-grow flex flex-col justify-center gap-8 z-10">

        <!-- Glitch Banner Header -->
        <section class="text-center my-4">
            <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-widest border border-gray-800 bg-cyber-card mb-4 text-gray-400">
                <i class="fas fa-lock text-xs mr-1 accent-text"></i> 404
            </div>
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight mb-3">
                <span class="glitch accent-glow-text" data-text="[ NOT FOUND ]">[ NOT FOUND ]</span>
            </h1>
            <p class="text-sm md:text-base text-gray-400 max-w-2xl mx-auto">
                (1) We couldn't find what you were looking for. <br>(2) You won't find anything here.
            </p>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-gray-800/80 bg-cyber-black/90 py-4 px-4 text-center text-xs text-gray-600 z-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>
                &copy; <span id="currentYear"></span> DOMAIN NODE RESERVED. ALL RIGHTS ENCRYPTED.
            </div>
            <div class="flex items-center gap-4 text-gray-500">
                <span>SYS_VER: 4.0.9</span>
                <span>•</span>
                <span>LATENCY: <span id="pingMs" class="accent-text">18ms</span></span>
            </div>
        </div>
    </footer>

    <!-- Theme / Customization Modal -->
    <div id="customPanel" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="cyber-card rounded-lg p-6 max-w-md w-full relative">
            <button onclick="toggleModal('customPanel')" class="absolute top-4 right-4 text-gray-500 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
            <h3 class="text-base font-bold uppercase tracking-wider text-white mb-4 border-b border-gray-800 pb-2">
                <i class="fas fa-sliders-h accent-text"></i> SYSTEM CONFIGURATION
            </h3>

            <div class="space-y-5 text-xs">
                <!-- Color Theme Selector -->
                <div>
                    <label class="block text-gray-400 mb-2 font-semibold">ACCENT COLOR MATRIX</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setTheme('green')" class="py-2 rounded border border-green-500/50 bg-green-950/30 text-green-400 font-bold hover:bg-green-900/40">GREEN</button>
                        <button onclick="setTheme('cyan')" class="py-2 rounded border border-cyan-500/50 bg-cyan-950/30 text-cyan-400 font-bold hover:bg-cyan-900/40">CYAN</button>
                        <button onclick="setTheme('amber')" class="py-2 rounded border border-amber-500/50 bg-amber-950/30 text-amber-400 font-bold hover:bg-amber-900/40">AMBER</button>
                        <button onclick="setTheme('red')" class="py-2 rounded border border-red-500/50 bg-red-950/30 text-red-400 font-bold hover:bg-red-900/40">RED</button>
                    </div>
                </div>

                <!-- Rain Speed Slider -->
                <div>
                    <div class="flex justify-between text-gray-400 mb-1">
                        <span>MATRIX RAIN DENSITY</span>
                        <span id="rainVal">35</span>
                    </div>
                    <input type="range" id="rainDensity" min="10" max="80" value="35" oninput="updateRainDensity(this.value)" class="w-full accent-green-500 bg-cyber-black">
                </div>

                <!-- Reset Defaults -->
                <div class="pt-2">
                    <button onclick="toggleModal('customPanel')" class="w-full py-2 bg-cyber-border text-white rounded font-bold hover:bg-gray-700 transition">
                        APPLY & CLOSE
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 cyber-card px-4 py-3 rounded border accent-border flex items-center gap-3 text-xs text-white">
        <i id="toastIcon" class="fas fa-check-circle accent-text text-base"></i>
        <span id="toastMessage">Action completed successfully.</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- Core Configuration & Variables ---
        const domainName = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' 
            ? window.location.hostname.toUpperCase() 
            : 'DARK-PROTOCOL.IO';

        let audioEnabled = false;
        let audioCtx = null;
        let matrixActive = true;
        let crtActive = true;
        let currentTheme = 'green';

        // Set Current Year
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // --- Typing Effect for Domain Name ---
        const typedElement = document.getElementById('domainTyped');
        let index = 0;
        function typeDomain() {
            if (index < domainName.length) {
                typedElement.textContent += domainName.charAt(index);
                index++;
                playBeep(800, 0.02);
                setTimeout(typeDomain, 70);
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeDomain, 500);
            initMatrix();
            startLogStream();
        });

        // --- Web Audio API Synthesizer (Retro Beeps) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq = 440, duration = 0.05, type = 'sine') {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (audioEnabled) {
                initAudio();
                icon.className = 'fas fa-volume-up accent-text';
                text.textContent = 'AUDIO: ON';
                playBeep(880, 0.1);
                showToast('Audio Feedback Synthesizer Enabled');
            } else {
                icon.className = 'fas fa-volume-mute text-red-400';
                text.textContent = 'AUDIO: OFF';
                showToast('Audio Feedback Muted');
            }
        }

        // --- Matrix Digital Rain Canvas ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let fontSize = 14;
        let columns = 0;
        let drops = [];
        let rainDensityValue = 35;

        function initMatrix() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * -100);
            }
        }

        window.addEventListener('resize', initMatrix);

        function drawMatrix() {
            if (!matrixActive) return;

            // Semi-transparent fade
            ctx.fillStyle = 'rgba(3, 3, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Matrix Color based on theme
            let themeHex = '#00ff66';
            if (currentTheme === 'cyan') themeHex = '#00f0ff';
            if (currentTheme === 'amber') themeHex = '#ffb000';
            if (currentTheme === 'red') themeHex = '#ff0055';

            ctx.fillStyle = themeHex;
            ctx.font = fontSize + 'px monospace';

            const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEF';

            for (let i = 0; i < drops.length; i++) {
                const text = katakana.charAt(Math.floor(Math.random() * katakana.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 40);

        function toggleMatrix() {
            matrixActive = !matrixActive;
            document.getElementById('matrixText').textContent = matrixActive ? 'RAIN: ON' : 'RAIN: OFF';
            if (!matrixActive) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            playBeep(600, 0.05);
        }

        function toggleCRT() {
            document.body.classList.toggle('crt');
            playBeep(500, 0.05);
            showToast('CRT Scanline Filter Toggled');
        }

        function updateRainDensity(val) {
            document.getElementById('rainVal').textContent = val;
            fontSize = Math.max(8, 24 - Math.floor(val / 5));
            initMatrix();
        }

        // --- CLI Simulator Logic ---
        const cliOutput = document.getElementById('cliOutput');
        const cliInput = document.getElementById('cliInput');

        const cliCommands = {
            'help': 'Available commands:<br>&nbsp;&nbsp;<span class="accent-text">whois</span> - Display domain registration details<br>&nbsp;&nbsp;<span class="accent-text">offer</span> - Focus inquiry form<br>&nbsp;&nbsp;<span class="accent-text">crypto</span> - Show accepted payment methods<br>&nbsp;&nbsp;<span class="accent-text">ping</span> - Check network node latency<br>&nbsp;&nbsp;<span class="accent-text">clear</span> - Clear console terminal<br>&nbsp;&nbsp;<span class="accent-text">matrix</span> - Toggle digital rain effect',
            'whois': `WHOIS Record for <span class="accent-text">${domainName}</span>:<br>&nbsp;&nbsp;Registrar: SECURE_ESCROW_NODE_09<br>&nbsp;&nbsp;Status: LOCKED / FOR SALE<br>&nbsp;&nbsp;Created: 2021-04-12<br>&nbsp;&nbsp;DNS: ns1.cyber-node.io, ns2.cyber-node.io<br>&nbsp;&nbsp;Escrow Partner: Verified SSL/TLS`,
            'offer': 'Redirecting to inquiry matrix form...',
            'crypto': 'Accepted Cryptocurrencies: BTC, ETH, XMR, USDT. Click crypto icons below for wallet IDs.',
            'ping': 'Pinging DNS root server... 18ms latency [OK]',
            'matrix': 'Matrix rain toggled.'
        };

        function handleCliSubmit(e) {
            e.preventDefault();
            const cmd = cliInput.value.trim().toLowerCase();
            if (!cmd) return;

            runCommand(cmd);
            cliInput.value = '';
        }

        function runCommand(cmd) {
            playBeep(700, 0.04);
            
            // Print command line
            const cmdLine = document.createElement('div');
            cmdLine.innerHTML = `<span class="accent-text">guest@cyber-node:~$</span> ${cmd}`;
            cliOutput.appendChild(cmdLine);

            // Print response
            const resLine = document.createElement('div');
            resLine.className = 'text-gray-400 mb-2';

            if (cmd === 'clear') {
                cliOutput.innerHTML = '<div class="text-gray-500">// TERMINAL CLEARED.</div>';
                return;
            } else if (cmd === 'offer') {
                resLine.innerHTML = cliCommands['offer'];
                document.getElementById('emailInput').focus();
            } else if (cmd === 'matrix') {
                toggleMatrix();
                resLine.innerHTML = 'Matrix rain state toggled.';
            } else if (cliCommands[cmd]) {
                resLine.innerHTML = cliCommands[cmd];
            } else {
                resLine.innerHTML = `<span class="text-red-400">Command not recognized: '${cmd}'. Type 'help' for available commands.</span>`;
            }

            cliOutput.appendChild(resLine);
            cliOutput.scrollTop = cliOutput.scrollHeight;
        }

        // --- Inquiry Form Submission Handling ---
        function handleInquirySubmit(e) {
            e.preventDefault();
            playBeep(900, 0.1, 'square');

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ENCRYPTING & TRANSMITTING...`;

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;

                // Log entry
                const email = document.getElementById('emailInput').value;
                const offer = document.getElementById('offerInput').value;
                addLogEntry(`INQUIRY TRANSMITTED: $${offer} from ${email.substring(0, 3)}***@***`);

                showToast('Inquiry encrypted & sent successfully to owner!');
                document.getElementById('inquiryForm').reset();

                // Console message
                const msg = document.createElement('div');
                msg.className = 'text-green-400 font-bold';
                msg.innerHTML = `[+] SUCCESS: Transmission acknowledged by remote escrow node.`;
                cliOutput.appendChild(msg);
                cliOutput.scrollTop = cliOutput.scrollHeight;
            }, 1800);
        }

        // --- Live System Monitor Log Streamer ---
        const logsContainer = document.getElementById('systemLogs');
        const sampleLogs = [
            'Pinging DNS root server node...',
            'Inquiry listener active on port 443',
            'PGP 4096-bit handshake: PASSED',
            'BGP Route verification: OK',
            'SSL Certificate check: VALID (AES-256)',
            'Inbound traffic scrubbed via DDoS mitigation',
            'Escrow gateway API ping: 200 OK',
            'Automated WHOIS query logged from 192.168.1.***'
        ];

        function addLogEntry(text) {
            const time = new Date().toISOString().substring(11, 19);
            const entry = document.createElement('div');
            entry.className = 'text-gray-400 font-mono';
            entry.innerHTML = `<span class="text-gray-600">[${time}]</span> <span class="accent-text">></span> ${text}`;
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function startLogStream() {
            sampleLogs.forEach((log, index) => {
                setTimeout(() => addLogEntry(log), index * 800);
            });

            setInterval(() => {
                const randomLog = sampleLogs[Math.floor(Math.random() * sampleLogs.length)];
                addLogEntry(randomLog);
            }, 7000);
        }

        // --- Theme Setter ---
        function setTheme(theme) {
            currentTheme = theme;
            document.body.className = document.body.className.replace(/theme-\w+/g, '');
            if (theme !== 'green') {
                document.body.classList.add(`theme-${theme}`);
            }
            playBeep(750, 0.05);
            showToast(`Theme changed to ${theme.toUpperCase()}`);
        }

        // --- Modal & Toast Controls ---
        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
            playBeep(500, 0.04);
        }

        function showCryptoModal(symbol, address) {
            document.getElementById('cryptoTitle').textContent = `${symbol} WALLET ADDRESS`;
            document.getElementById('cryptoAddressText').textContent = address;
            document.getElementById('cryptoQR').src = `https://placehold.co/150x150/000000/FFFFFF?text=${symbol}+QR`;
            toggleModal('cryptoModal');
        }

        function copyDomain() {
            copyToClipboard(domainName);
            const icon = document.getElementById('copyIcon');
            icon.className = 'fas fa-check text-green-400';
            setTimeout(() => icon.className = 'far fa-copy', 2000);
            showToast('Domain name copied to clipboard');
        }

        function copyCryptoAddress() {
            const addr = document.getElementById('cryptoAddressText').textContent.trim();
            copyToClipboard(addr);
            showToast('Wallet address copied to clipboard');
            toggleModal('cryptoModal');
        }

        function copyToClipboard(text) {
            playBeep(850, 0.05);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // --- Random Ping Simulator ---
        setInterval(() => {
            const ping = Math.floor(Math.random() * 15) + 12;
            document.getElementById('pingMs').textContent = `${ping}ms`;
        }, 4000);
    </script>
</body>
</html>
